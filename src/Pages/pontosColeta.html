<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../output.css" rel="stylesheet">

</head>

<body>
    <header>
        <div class="flex fixed bg-green-600 w-full h-23">
            <div class="container flex items-center mx-auto">
                <div class="">
                    <img src="../IMG/logoSemFundo.png" alt="Conecta Alimento" class="w-60 pt-3">
                </div>
                <div class="flex justify-end flex-1 md:hidden text-white text-3xl">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="items-end flex-1 text-white font-bold hidden md:flex">
                    <nav class="flex-1">
                        <ul class="flex justify-end flex-1">
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Pontos de coleta</a>
                            </li>
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Pessoas à ajudar</a>
                            </li>
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Quais Alimentos</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>

    </header>

    <main>

            <p class="text-3xl font-bold text-green-700">Pontos de Coleta/entrega</p>

        </div>

        <div class="flex flex-col items-center gap-8 pt-12">

                <div class="flex flex-col items-center text-center gap-4">

                    <div>
                        <p class="text-2xl font-bold">
                            Mercado Fácil
                        </p>
                    </div>

                    <div class="w-80">
                        <img src="../IMG/mercado01.png" alt="" class="rounded-2xl w-full">
                    </div>

                    <div>
                        <iframe class="rounded-2xl border w-72 h-52"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10428.908488290797!2d-52.62002602209584!3d-27.085225901410638!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94e4b681cc5f8431%3A0x31f77f485ddce82!2sEco%20Parque!5e1!3m2!1spt-BR!2sbr!4v1779651078465!5m2!1spt-BR!2sbr"
                            style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">

                </div>

            </div>

            <div class="w-10/12 border rounded-2xl p-6">

                    <p class="text-2xl font-bold">
                        Mercado Meu Mercado

                    <div class="w-80">
                        <img src="../IMG/mercado02.png" alt="" class="rounded-2xl w-full">
                    </div>

                    <iframe class="rounded-2xl border w-72 h-52" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7373.400087794769!2d-52.64300283727411!3d-27.099683209469713!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94e4b68387a150a9%3A0x2c21e153f73f12a!2sComplexo%20Esportivo%20Verd%C3%A3o!5e1!3m2!1spt-BR!2sbr!4v1779666971957!5m2!1spt-BR!2sbr" style="border:0;">
                    </iframe>

                </div>
            </div>

            <div class="w-10/12 border rounded-2xl p-6">
                <div class="flex flex-col items-center text-center gap-4">

                    <p class="text-2xl font-bold">
                        Hortifruti verde fresco
                    </p>

                    <div class="w-80">
                        <img src="../IMG/mercado03.png" alt="" class="rounded-2xl w-full">
                    </div>

                    <iframe class="rounded-2xl border w-72 h-52"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10428.908488290797!2d-52.62002602209584!3d-27.085225901410638!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94e4b681cc5f8431%3A0x31f77f485ddce82!2sEco%20Parque!5e1!3m2!1spt-BR!2sbr!4v1779651078465!5m2!1spt-BR!2sbr"
                            style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">

            </div>

            <div class="w-10/12 border rounded-2xl p-6">

                    <p class="text-2xl font-bold">

                    </div>

                    <iframe class="rounded-2xl border w-72 h-52" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7373.400087794769!2d-52.64300283727411!3d-27.099683209469713!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94e4b68387a150a9%3A0x2c21e153f73f12a!2sComplexo%20Esportivo%20Verd%C3%A3o!5e1!3m2!1spt-BR!2sbr!4v1779666971957!5m2!1spt-BR!2sbr" style="border:0;">
                    </iframe>
