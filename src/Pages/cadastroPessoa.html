<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../output.css" rel="stylesheet">

</head>

<body>
    <header>
        <div class="flex fixed bg-green-600 w-full h-23">
            <div class="container flex items-center mx-auto">
                <div class="">
                    <img src="../IMG/logoSemFundo.png" alt="Conecta Alimento" class="w-60 pt-3">
                </div>
                <div class="flex justify-end flex-1 md:hidden text-white text-3xl">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="items-end flex-1 text-white font-bold hidden md:flex">
                    <nav class="flex-1">
                        <ul class="flex justify-end flex-1">
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Pontos de coleta</a>
                            </li>
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Pessoas à ajudar</a>
                            </li>
                            <li class="px-4">
                                <a href="#" class="hover:text-hoverspt text-sm">Quais Alimentos</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>

    </header>
    <main> 
        <div class="flex w-full h-screen justify-center items-center pt-20">
            <div class="w-10/12 h-9/12 bg-gray-50 rounded-3xl
            lg:w-8/12 shadow-2xl">
                <div class="w-full h-30 bg-gre-500 pt-4 pl-4 ">
                    <p class="text-3xl font-bold">Precisa de ajuda? faça seu cadastro</p>
                </div>
                    <div class="grid grid-cols-1  
                    lg:grid-cols-2">  

                        <div class="flex flex-wrap justify-center"> 
                            <input type="text" placeholder="Nome" class="border w-10/12 h-10 rounded-2xl pl-5">
                            <input type="text" placeholder="Número de telefone" class="border w-10/12 h-10 rounded-2xl pl-5 mt-4">
                            <input type="text" placeholder="email" class="border w-10/12 h-10 rounded-2xl pl-5 mt-4">
                            <input type="text" placeholder="Cpf" class="border w-10/12 h-10 rounded-2xl pl-5 mt-4">
                        </div>
                        <div class="flex flex-col items-center">
                            <input type="text" placeholder="Data de Nascimento" class="border w-10/12 h-10 rounded-2xl pl-5 mt-4 lg:mt-0">
                            <input type="text" placeholder="Localização" class="border w-10/12 h-10 rounded-2xl pl-5 mt-4">
                            <button class="border w-10/12 h-10 rounded-2xl mt-4">Cadastrar</button>
                        </div>
                            
                    </div>
                
            </div>  
        </div>


    </main>
</body>


</html>
